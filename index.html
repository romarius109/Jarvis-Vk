<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>VK Token</title>
    <script src="https://unpkg.com/@vkontakte/vk-bridge/dist/browser.min.js"></script>
</head>
<body style="font-family: sans-serif; padding: 20px; background: #222; color: #fff;">
    <h1>Получение токена VK</h1>
    <p>Нажми кнопку ниже, разреши доступ, скопируй токен.</p>
    <button id="get" style="padding: 15px 30px; font-size: 18px; cursor: pointer;">
        Получить токен
    </button>
    <pre id="result" style="margin-top: 20px; padding: 10px; background: #000; word-wrap: break-word; white-space: pre-wrap;"></pre>

    <script>
        const bridge = vkBridge.default;
        const result = document.getElementById('result');

        document.getElementById('get').onclick = async () => {
            try {
                await bridge.send('VKWebAppInit');
                result.textContent = 'Инициализация...';

                const data = await bridge.send('VKWebAppGetAuthToken', {
                    app_id: 54808329,
                    scope: 'messages,offline'
                });

                result.textContent = 'ACCESS TOKEN:\n' + data.access_token;
            } catch (e) {
                result.textContent = 'Ошибка: ' + JSON.stringify(e, null, 2);
            }
        };
    </script>
</body>
</html>
